<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#07070b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8"/>
  <rect width="100%" height="100%" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.15" rx="8"/>
  
  <!-- Content Mockup -->
  <!-- Stats lines -->
  <line x1="40" y1="50" x2="360" y2="50" stroke="#1e293b" stroke-width="2"/>
  <line x1="40" y1="150" x2="360" y2="150" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Sentiments Bars -->
  <rect x="40" y="75" width="220" height="15" rx="4" fill="url(#cyanGrad)"/>
  <text x="270" y="87" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold">65% POSITIVE</text>
  
  <rect x="40" y="105" width="80" height="15" rx="4" fill="#ef4444"/>
  <text x="130" y="117" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">20% NEGATIVE</text>
  
  <!-- Headline -->
  <text x="40" y="35" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">sentiment_analysis.py</text>
</svg>
