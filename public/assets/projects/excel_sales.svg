<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051512" />
      <stop offset="100%" stop-color="#020908" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8"/>
  <rect width="100%" height="100%" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" rx="8"/>
  
  <!-- Bar Charts -->
  <rect x="50" y="120" width="30" height="40" rx="2" fill="url(#greenGrad)" opacity="0.6"/>
  <rect x="100" y="90" width="30" height="70" rx="2" fill="url(#greenGrad)" opacity="0.7"/>
  <rect x="150" y="60" width="30" height="100" rx="2" fill="url(#greenGrad)" opacity="0.8"/>
  <rect x="200" y="110" width="30" height="50" rx="2" fill="url(#greenGrad)" opacity="0.6"/>
  <rect x="250" y="80" width="30" height="80" rx="2" fill="url(#greenGrad)" opacity="0.8"/>
  <rect x="300" y="40" width="30" height="120" rx="2" fill="url(#greenGrad)" opacity="1"/>
  
  <!-- Baseline -->
  <line x1="40" y1="160" x2="360" y2="160" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Headline -->
  <text x="40" y="30" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">Excel_Sales_Dashboard.xlsx</text>
</svg>
