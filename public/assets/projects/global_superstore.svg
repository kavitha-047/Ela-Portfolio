<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8"/>
  <rect width="100%" height="100%" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2" rx="8"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="370" height="24" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="25" y="31" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">GLOBAL SUPERSTORE | SALES &amp; PROFIT</text>

  <!-- KPI Mini Cards -->
  <g transform="translate(15, 46)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="115" height="32" rx="4" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="8" y="13" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="600">Total Sales</text>
    <text x="8" y="26" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">$2.05M</text>

    <!-- KPI 2 -->
    <rect x="127" y="0" width="115" height="32" rx="4" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="135" y="13" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="600">Total Profit</text>
    <text x="135" y="26" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">$246.45K</text>

    <!-- KPI 3 -->
    <rect x="254" y="0" width="116" height="32" rx="4" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="262" y="13" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="600">Profit Margin</text>
    <text x="262" y="26" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">12.0%</text>
  </g>

  <!-- Bar Chart Widget -->
  <g transform="translate(15, 88)">
    <rect x="0" y="0" width="230" height="96" rx="4" fill="#0f172a" opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    <text x="10" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="8" font-weight="bold">Sales by Market</text>

    <rect x="10" y="24" width="160" height="8" rx="2" fill="url(#blueGrad)"/>
    <text x="175" y="31" fill="#94a3b8" font-family="sans-serif" font-size="7">APAC</text>

    <rect x="10" y="37" width="140" height="8" rx="2" fill="url(#blueGrad)" opacity="0.85"/>
    <text x="155" y="44" fill="#94a3b8" font-family="sans-serif" font-size="7">LATAM</text>

    <rect x="10" y="50" width="130" height="8" rx="2" fill="url(#blueGrad)" opacity="0.75"/>
    <text x="145" y="57" fill="#94a3b8" font-family="sans-serif" font-size="7">US</text>

    <rect x="10" y="63" width="120" height="8" rx="2" fill="url(#blueGrad)" opacity="0.65"/>
    <text x="135" y="70" fill="#94a3b8" font-family="sans-serif" font-size="7">EU</text>

    <rect x="10" y="76" width="70" height="8" rx="2" fill="url(#blueGrad)" opacity="0.5"/>
    <text x="85" y="83" fill="#94a3b8" font-family="sans-serif" font-size="7">EMEA</text>
  </g>

  <!-- Donut Ring Widget -->
  <g transform="translate(255, 88)">
    <rect x="0" y="0" width="130" height="96" rx="4" fill="#0f172a" opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    <text x="10" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="8" font-weight="bold">Segment Share</text>

    <!-- Donut Ring Representation -->
    <circle cx="65" cy="54" r="26" fill="none" stroke="#3b82f6" stroke-width="10"/>
    <circle cx="65" cy="54" r="26" fill="none" stroke="#06b6d4" stroke-width="10" stroke-dasharray="105 163"/>
    <circle cx="65" cy="54" r="26" fill="none" stroke="#f59e0b" stroke-width="10" stroke-dasharray="45 163" stroke-dashoffset="-105"/>
    <text x="65" y="57" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">51.5%</text>
  </g>
</svg>
