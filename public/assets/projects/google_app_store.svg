      <stop offset="0%" stop-color="#0e0b1c" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8"/>
  <rect width="100%" height="100%" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.15" rx="8"/>
  
  <!-- Grid Lines -->
  <line x1="50" y1="50" x2="350" y2="50" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="50" y1="100" x2="350" y2="100" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="50" y1="150" x2="350" y2="150" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>
  
  <line x1="125" y1="40" x2="125" y2="160" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="40" x2="200" y2="160" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="275" y1="40" x2="275" y2="160" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Plot Points -->
  <circle cx="90" cy="120" r="7" fill="url(#purpleGrad)"/>
  <circle cx="150" cy="70" r="10" fill="#06b6d4"/>
  <circle cx="210" cy="140" r="6" fill="url(#purpleGrad)"/>
  <circle cx="240" cy="60" r="12" fill="#06b6d4" opacity="0.8"/>
  <circle cx="310" cy="100" r="8" fill="url(#purpleGrad)"/>
  
  <!-- Headline -->
  <text x="40" y="30" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">google_app_analysis.sql</text>
